name: Deploying

on:
  push:
    branches:
      - production
  workflow_dispatch:

jobs:
  build_pwa:
    name: Build PWA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install pnpm packages
        run: pnpm install

      - name: Build project
        run: pnpm run build:pwa
