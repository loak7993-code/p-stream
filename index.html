    <!-- StreamViva splash — midnight signal boot -->
    <style>
      #viva-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        gap: 26px;
        padding: 0 min(14vw, 180px);
        background:
          radial-gradient(ellipse 80% 50% at 50% 0%, hsla(210, 60%, 12%, 0.55) 0%, transparent 60%),
          hsla(220, 15%, 5%, 1);
        font-family: "IBM Plex Mono", monospace;
        transition: opacity 0.45s steps(6, end), visibility 0.45s;
      }
      #viva-splash.done {
        opacity: 0;
        visibility: hidden;
      }
      .sig-boot-row {
        font-size: 12px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: hsla(190, 60%, 64%, 0.85);
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .sig-boot-row .dim { color: hsla(213, 14%, 44%, 1); }
      .sig-boot-mark {
        font-family: "Archivo", system-ui, sans-serif;
        font-weight: 900;
        font-stretch: 115%;
        font-size: clamp(46px, 10vw, 104px);
        line-height: 0.94;
        letter-spacing: -0.01em;
        text-transform: uppercase;
        color: hsla(210, 40%, 98%, 1);
      }
      .sig-boot-mark .cy {
        background: linear-gradient(96deg, hsla(190, 100%, 78%, 1) 0%, hsla(189, 92%, 64%, 1) 55%, hsla(290, 82%, 66%, 1) 130%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .sig-onair {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        border: 1px solid hsla(0, 84%, 64%, 0.6);
        padding: 7px 14px;
        font-size: 11px;
        letter-spacing: 0.3em;
        color: hsla(0, 92%, 72%, 1);
      }
      .sig-onair-dot {
        width: 8px;
        height: 8px;
        background: hsla(0, 84%, 64%, 1);
        animation: sigBlink 1.2s steps(2, end) infinite;
      }
      @keyframes sigBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.15; }
      }
      .sig-bars {
        display: flex;
        gap: 4px;
        height: 22px;
        align-items: flex-end;
      }
      .sig-bars span {
        width: 5px;
        background: hsla(189, 92%, 64%, 1);
        animation: sigBar 1s steps(4, end) infinite;
      }
      .sig-bars span:nth-child(1) { height: 30%; animation-delay: 0s; }
      .sig-bars span:nth-child(2) { height: 60%; animation-delay: 0.12s; }
      .sig-bars span:nth-child(3) { height: 100%; animation-delay: 0.24s; }
      .sig-bars span:nth-child(4) { height: 55%; animation-delay: 0.36s; }
      .sig-bars span:nth-child(5) { height: 80%; animation-delay: 0.48s; }
      @keyframes sigBar {
        0%, 100% { transform: scaleY(0.35); }
        50% { transform: scaleY(1); }
      }
      .sig-boot-lines > div {
        opacity: 0;
        animation: sigLine 0.3s steps(3, end) forwards;
      }
      .sig-boot-lines > div:nth-child(1) { animation-delay: 0.05s; }
      .sig-boot-lines > div:nth-child(2) { animation-delay: 0.25s; }
      .sig-boot-lines > div:nth-child(3) { animation-delay: 0.45s; }
      @keyframes sigLine {
        to { opacity: 1; }
      }
    </style>
    <div id="viva-splash" aria-hidden="true">
      <div class="sig-boot-mark">Stream<span class="cy">Viva</span></div>
      <div class="sig-onair"><span class="sig-onair-dot"></span>ON AIR</div>
      <div class="sig-bars"><span></span><span></span><span></span><span></span><span></span></div>
      <div class="sig-boot-lines">
        <div class="sig-boot-row">> acquiring signal <span class="dim">............</span> OK</div>
        <div class="sig-boot-row">> mounting sources <span class="dim">..........</span> 35</div>
        <div class="sig-boot-row">> transmission <span class="dim">..................</span> LIVE</div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
    <script>
      // hide splash once the app has rendered
      (function () {
        var hide = function () {
          var s = document.getElementById("viva-splash");
          if (s) {
            s.classList.add("done");
            setTimeout(function () { s.remove(); }, 700);
          }
        };
        var root = document.getElementById("root");
        if (root && root.childElementCount > 0) return hide();
        var t = setInterval(function () {
          if (root && root.childElementCount > 0) {
            clearInterval(t);
            hide();
          }
        }, 80);
        setTimeout(function () { clearInterval(t); hide(); }, 12000);
      })();
    </script>
