    <!-- StreamViva splash — silk -->
    <style>
      #viva-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 34px;
        background:
          radial-gradient(ellipse 60% 38% at 50% -5%, hsla(245, 55%, 22%, 0.55) 0%, transparent 70%),
          hsla(240, 9%, 6%, 1);
        font-family: "Instrument Sans", system-ui, sans-serif;
        transition: opacity 0.7s ease, visibility 0.7s ease;
      }
      #viva-splash.done {
        opacity: 0;
        visibility: hidden;
      }
      .silk-mark {
        font-family: "Instrument Serif", Georgia, serif;
        font-size: clamp(44px, 8.5vw, 84px);
        font-weight: 400;
        letter-spacing: -0.015em;
        color: hsla(240, 30%, 99%, 1);
        animation: silkFade 1.1s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .silk-mark em {
        font-style: italic;
        background: linear-gradient(
          100deg,
          hsla(243, 92%, 82%, 1) 0%,
          hsla(245, 84%, 72%, 1) 50%,
          hsla(40, 55%, 88%, 1) 115%
        );
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      @keyframes silkFade {
        from { opacity: 0; transform: translateY(14px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .silk-line {
        width: 180px;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          hsla(245, 70%, 70%, 0.8),
          transparent
        );
        animation: silk-line 1.4s cubic-bezier(0.22, 1, 0.36, 1) 0.25s both;
        transform-origin: center;
      }
      .silk-sub {
        font-size: 12px;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: hsla(240, 10%, 58%, 1);
        animation: silkFade 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.45s both;
      }
    </style>
    <div id="viva-splash" aria-hidden="true">
      <div class="silk-mark">Stream<em>Viva</em></div>
      <div class="silk-line"></div>
      <div class="silk-sub">now showing</div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
    <script>
      // hide splash once the app has rendered
      (function () {
        var hide = function () {
          var s = document.getElementById("viva-splash");
          if (s) {
            s.classList.add("done");
            setTimeout(function () { s.remove(); }, 700);
          }
        };
        var root = document.getElementById("root");
        if (root && root.childElementCount > 0) return hide();
        var t = setInterval(function () {
          if (root && root.childElementCount > 0) {
            clearInterval(t);
            hide();
          }
        }, 80);
        setTimeout(function () { clearInterval(t); hide(); }, 12000);
      })();
    </script>
